services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ainotes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d ainotes"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://student:devpassword@db:5432/ainotes
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
