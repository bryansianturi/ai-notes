apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ai-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/bryansianturi/ai-notes:88c11d383bc6119bd4b74dede4b51ebb3cc226e8
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-notes-db
                  key: DATABASE_URL
            - name: OLLAMA_URL
              value: http://host.docker.internal:11434
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ai-notes
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8000
