apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ai-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/bryansianturi/ai-notes:c8f946a33fd3bd9a134a9dd842743e4febc12f70
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-notes-db
                  key: DATABASE_URL
            - name: OLLAMA_URL
              value: http://host.docker.internal:11434
          # Ready = the database answers, so traffic only goes to pods that can serve it
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          # Alive = the process responds. Generous, so slow summaries don't cause restarts
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ai-notes
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8000
