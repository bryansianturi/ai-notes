apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/bryansianturi/ai-notes-frontend:c8f946a33fd3bd9a134a9dd842743e4febc12f70
          ports:
            - containerPort: 8080
          env:
            # nginx forwards /api/* here: the web Service inside the cluster
            - name: API_UPSTREAM
              value: http://web
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-notes
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
