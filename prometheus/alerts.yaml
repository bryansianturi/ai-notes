groups:
  - name: ai-notes
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m]))
            / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: AppDown
        expr: up{job="ai-notes"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus can't reach ai-notes"
