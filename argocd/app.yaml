apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bryansianturi/ai-notes.git
    targetRevision: main # watch the main branch...
    path: k8s # ...and this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-notes
  syncPolicy:
    automated:
      prune: true # delete things removed from Git
      selfHeal: true # undo manual changes
