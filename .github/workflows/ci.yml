name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres just for this run
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: student
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ainotes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U student -d ainotes"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-24.04-arm # ARM, same CPU type as your Mac
    permissions:
      contents: read
      packages: write # allows pushing to GHCR
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
